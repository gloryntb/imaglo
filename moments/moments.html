    // ============================================================
    // ⚙️ HET SCRIPT DAT ALLES AUTOMATISCH BOUWT (Niet aanpassen)
    // ============================================================
    
    function buildGrid() {
      const mainGrid = document.getElementById('main-photo-grid');
      mainGrid.innerHTML = '';
      
      myAlbums.forEach((album, index) => {
        const item = document.createElement('div');
        item.className = `photo-item ${album.category}`;
        item.setAttribute('onclick', `openAlbumByIndex(${index})`);
        
        // We pakken de eerste letter of een emoji op basis van de categorie voor lege covers
        let fallbackEmoji = '✨';
        if (album.category === 'diner') fallbackEmoji = '🍕';
        if (album.category === 'uitstapje') fallbackEmoji = '✈️';
        if (album.category === 'actief') fallbackEmoji = '🎯';

        item.innerHTML = `
          <div class="photo-wrapper">
            <img src="pic/${album.coverImage}" alt="${album.title}" loading="lazy" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="fallback-cover" style="display:none; height:200px; background:#ffe3e3; flex-direction:column; justify-content:center; align-items:center; color:#ff4d6d; font-size:3rem; border-radius:15px;">
              <span>${fallbackEmoji}</span>
              <span style="font-size: 1rem; margin-top: 10px; font-weight: bold;">Foto volgt!</span>
            </div>
            <div class="photo-caption">${album.title}</div>
          </div>
        `;
        mainGrid.appendChild(item);
      });
    }

    function openAlbumByIndex(index) {
      const album = myAlbums[index];
      const grid = document.getElementById('pinterest-grid');
      const titleElement = document.getElementById('album-title');
      
      titleElement.innerText = album.title;
      grid.innerHTML = ''; 
      
      album.photos.forEach(photoName => {
        const img = document.createElement('img');
        img.src = `pic/${album.folder}/${photoName}`; 
        img.alt = album.title;
        img.loading = 'lazy';
        grid.appendChild(img);
      });
      
      document.getElementById('album-overlay').style.display = "block";
      document.body.style.overflow = "hidden";
    }

    // Bouw het grid zodra de pagina laadt
    buildGrid();

    // NAVBAR & FILTERS
    function toggleMenu() { document.getElementById("navLinks").classList.toggle("active"); }
    
    function filterSelection(c) {
      var x = document.getElementsByClassName("photo-item");
      if (c == "all") c = "";
      for (var i = 0; i < x.length; i++) {
        x[i].style.display = "none";
        if (x[i].className.indexOf(c) > -1) x[i].style.display = "block";
      }
      var btns = document.querySelectorAll(".filter-btn");
      btns.forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
    }

    function closeAlbum() {
      document.getElementById('album-overlay').style.display = "none";
      document.body.style.overflow = "auto";
    }

    window.onclick = function(event) {
      const overlay = document.getElementById('album-overlay');
      if (event.target == overlay) closeAlbum();
    }
